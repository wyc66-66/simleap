[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simleap"
version = "0.1.0"
description = "How simulation fidelity budgets decide sim-to-real transfer reliability"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
paper = [
    "matplotlib",
    "markdown",
    "scipy",
]
ui = [
    "fastapi",
    "uvicorn",
]

[tool.setuptools.packages.find]
where = ["src"]
