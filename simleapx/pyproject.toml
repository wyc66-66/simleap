[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simleapx"
version = "0.1.0"
description = "SimLeap fidelity protocol ported to MotriX (GS-Playground's velocity-impulse contact engine)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
motrix = [
    "motrixsim-core==0.7.1.dev97295",
]
test = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
